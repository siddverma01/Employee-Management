server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never stay cached — browsers need to re-request it so new
    # hashed asset references are picked up immediately after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # API + uploads proxied to the backend service
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080;
    }
    location /v3/ {
        proxy_pass http://backend:8080;
    }

    # Static assets are content-hashed, so they are safe to cache optimistically.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}