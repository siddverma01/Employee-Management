<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hpe-element.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inter is vendored locally in public/fonts (see the @font-face rules in
         src/index.css). Preloading the latin subset starts the fetch during HTML
         parse instead of after the CSS is applied, avoiding a visible swap. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Employee management</title>
    <script type="module" crossorigin src="/assets/index-BjuOflQQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BZrPcR0I.css">
  </head>
  <body class="bg-surface-50 text-surface-800 font-sans">
    <div id="root"></div>
  </body>
</html>
